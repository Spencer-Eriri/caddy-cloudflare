name: Build Caddy with Cloudflare DNS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          tags: caddy-cloudflare:latest
          outputs: type=docker,dest=/tmp/caddy-cloudflare.tar

      - name: Compress image
        run: gzip /tmp/caddy-cloudflare.tar

      - name: Generate tag
        id: tag
        run: echo "tag=build-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Caddy Cloudflare ${{ steps.tag.outputs.tag }}
          files: /tmp/caddy-cloudflare.tar.gz
